apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: be-a-dev-portal
  namespace: sites
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
spec:
  ingressClassName: haproxy-official
  tls:
    - hosts:
        - be-a.dev
        - www.be-a.dev
      secretName: be-a-dev-tls
  rules:
    - host: be-a.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: free-domains-portal
                port:
                  number: 8080
    - host: "*.be-a.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: free-domains-portal
                port:
                  number: 8080
