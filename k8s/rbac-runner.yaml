apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: be-a-dev-portal-deployer
  namespace: sites
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: be-a-dev-portal-deployer-binding
  namespace: sites
subjects:
  - kind: ServiceAccount
    name: be-a-dev-runners-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: Role
  name: be-a-dev-portal-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: be-a-dev-zones-updater
  namespace: platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["public-coredns-zones"]
    verbs: ["get", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: be-a-dev-zones-updater-binding
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: be-a-dev-runners-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: Role
  name: be-a-dev-zones-updater
  apiGroup: rbac.authorization.k8s.io
