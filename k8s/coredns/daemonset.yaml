apiVersion: v1
kind: ConfigMap
metadata:
  name: public-coredns-config
  namespace: platform
  labels:
    app: public-authoritative-coredns
data:
  Corefile: |
    be-a.dev:53 {
        log
        errors
        file /etc/coredns/zones/db.be-a.dev {
            reload 5s
            fallthrough
        }
        template IN A be-a.dev {
            match ^([a-zA-Z0-9-]+\.)+be-a\.dev\.$
            answer "{{ .Name }} 60 IN A 130.78.191.155"
        }
        minimal-any
        prometheus :9153
        cache 300
    }

    kra67.space:53 {
        log
        errors
        file /etc/coredns/zones/db.kra67.space {
            reload 5s
            fallthrough
        }
        template IN A kra67.space {
            match ^([a-zA-Z0-9-]+\.)+kra67\.space\.$
            answer "{{ .Name }} 60 IN A 130.78.191.155"
        }
        minimal-any
        prometheus :9153
        cache 300
    }

    plmt.tech:53 {
        log
        errors
        file /etc/coredns/zones/db.plmt.tech {
            reload 5s
            fallthrough
        }
        template IN A plmt.tech {
            match ^([a-zA-Z0-9-]+\.)+plmt\.tech\.$
            answer "{{ .Name }} 60 IN A 130.78.191.155"
        }
        minimal-any
        prometheus :9153
        cache 300
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: public-authoritative-coredns
  namespace: platform
  labels:
    app: public-authoritative-coredns
spec:
  selector:
    matchLabels:
      app: public-authoritative-coredns
  template:
    metadata:
      labels:
        app: public-authoritative-coredns
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: platform-critical
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "lg"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nlrapid-divide.datagio.net
                      - dezero-grid.datagio.net
                      - pldark-quill.datagio.net
      containers:
        - name: coredns
          image: coredns/coredns:1.12.0
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
            - name: zones-volume
              mountPath: /etc/coredns/zones
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: public-coredns-config
        - name: zones-volume
          configMap:
            name: public-coredns-zones
