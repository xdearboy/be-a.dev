name: Compile & Sync Zones

on:
  push:
    branches: [main]
    paths:
      - 'domains/**'
      - 'config/**'

jobs:
  compile-and-sync:
    name: Compile & Sync CoreDNS Zones
    runs-on: be-a-dev-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Registry CLI
        run: go build -o bin/registry ./cmd/registry

      - name: Compile Zones
        run: ./bin/registry compile --out-dir ./zones

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Apply CoreDNS Zone ConfigMap to Cluster
        run: |
          kubectl create configmap public-coredns-zones \
            --from-file=db.be-a.dev=zones/db.be-a.dev \
            -n platform \
            --dry-run=client -o yaml | kubectl apply -f -
