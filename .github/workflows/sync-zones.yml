name: Compile & Sync Zones

on:
  push:
    branches: [main]
    paths:
      - 'domains/**'
      - 'config/**'

jobs:
  compile:
    name: Compile RFC 1035 BIND Zones
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Registry CLI
        run: go build -o bin/registry ./cmd/registry

      - name: Compile Zones
        run: ./bin/registry compile --out-dir ./zones

      - name: Upload Zone Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-zones
          path: ./zones/
