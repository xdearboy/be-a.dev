<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subdomain Available &bull; {{.Subdomain}}.{{.Zone}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body style="justify-content: center; align-items: center; text-align: center;">
  <div class="gradient-mesh"></div>

  <div class="container" style="max-width: 640px; padding: 3rem 1.5rem;">
    <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 20px; padding: 3rem 2rem; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);">
      <div style="font-size: 3.5rem; margin-bottom: 1rem;">🎉</div>
      <div class="hero-tag" style="margin-bottom: 1rem;">Available Domain</div>
      <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.75rem; word-break: break-all;">
        <span class="gradient-text">{{.Subdomain}}</span>.{{.Zone}}
      </h1>
      <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem;">
        This subdomain is currently unallocated and ready to be claimed for your personal project, blog, or bot.
      </p>

      <a href="https://github.com/xdearboy/free-domains/new/main?filename=domains/{{.Zone}}/{{.Shard}}/{{.Subdomain}}.json" 
         target="_blank" class="claim-btn" style="font-size: 1.1rem; padding: 1rem 2rem; display: inline-block;">
        🚀 Claim {{.Subdomain}}.{{.Zone}} for Free
      </a>

      <div style="margin-top: 2.5rem; border-top: 1px solid var(--border-color); pt-3; font-size: 0.85rem; color: var(--text-muted); padding-top: 1.5rem;">
        Powered by FreeDomains Authoritative CoreDNS Stack &bull; <a href="https://github.com/xdearboy/free-domains" style="color: var(--accent-cyan); text-decoration: none;">View Registry</a>
      </div>
    </div>
  </div>
</body>
</html>
